trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: Validate
    displayName: 'Validate'
    jobs:
      - job: Validate
        displayName: 'Lint, Test & Version Check'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '22.x'
            displayName: 'Install Node.js 22.x'

          - script: npm ci
            displayName: 'Install dependencies'

          - script: npm run format:check
            displayName: 'Check formatting (Prettier)'

          - script: npm run lint
            displayName: 'Lint (ESLint)'

          - script: npm run typecheck
            displayName: 'Type check (tsc)'

          - script: npm test
            displayName: 'Run tests (Vitest)'

          - task: npmAuthenticate@0
            inputs:
              workingFile: .npmrc
            displayName: 'Authenticate with Azure Artifacts'
            condition: eq(variables['Build.Reason'], 'PullRequest')

          - script: |
              PACKAGE_NAME=$(node -p "require('./package.json').name")
              PACKAGE_VERSION=$(node -p "require('./package.json').version")
              echo "Checking if ${PACKAGE_NAME}@${PACKAGE_VERSION} is already published..."

              if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version 2>/dev/null; then
                echo "##vso[task.logissue type=error]Version ${PACKAGE_VERSION} of ${PACKAGE_NAME} is already published. Please bump the version in package.json before merging."
                exit 1
              else
                echo "Version ${PACKAGE_VERSION} is not yet published. Good to go."
              fi
            displayName: 'Check version is not already published'
            condition: eq(variables['Build.Reason'], 'PullRequest')

  - stage: Publish
    displayName: 'Publish to Azure Artifacts'
    dependsOn: Validate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: Publish
        displayName: 'Build & Publish'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '22.x'
            displayName: 'Install Node.js 22.x'

          - script: npm ci
            displayName: 'Install dependencies'

          - script: npm run build
            displayName: 'Build (tsup)'

          - task: npmAuthenticate@0
            inputs:
              workingFile: .npmrc
            displayName: 'Authenticate with Azure Artifacts'

          - script: npm publish
            displayName: 'Publish package'
